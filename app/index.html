<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendrier de l'Avent</title>
  <meta name="description" content="Un calendrier de l'Avent en ligne : une case s'ouvre chaque jour, du 1er au 24 décembre.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="bandeau-apercu" class="bandeau-apercu" hidden></p>

  <header class="entete">
    <div class="bloc-titre">
      <span class="onomatopee" lang="ja" aria-hidden="true">ドン！</span>
      <h1 id="titre">Calendrier de l'Avent</h1>
      <p id="sous-titre" class="sous-titre"></p>
    </div>
    <ul class="legende" aria-label="Légende des cases">
      <li><span class="pastille ouverte" data-icone="ouverte"></span>Ouverte</li>
      <li><span class="pastille du-jour" data-icone="du-jour"></span>Case du jour</li>
      <li><span class="pastille fermee" data-icone="fermee"></span>Pas encore</li>
    </ul>
  </header>

  <p id="mot-de-fin" class="mot-de-fin" hidden></p>

  <main>
    <ol id="grille" class="grille" aria-label="Les 24 cases du calendrier"></ol>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <footer id="pied" class="pied"></footer>

  <dialog id="fenetre" class="fenetre" aria-labelledby="fenetre-titre">
    <div class="fenetre-haut">
      <p id="fenetre-jour" class="fenetre-jour"></p>
      <button type="button" class="fermer" id="fermer" aria-label="Fermer la case">Fermer</button>
    </div>
    <div id="fenetre-vitrine" class="fenetre-vitrine">
      <div id="fenetre-image" class="fenetre-image" hidden></div>
      <div class="fenetre-info">
        <p id="fenetre-illustration" class="fenetre-illustration" aria-hidden="true"></p>
        <p id="fenetre-anime" class="fenetre-anime"></p>
        <div id="fenetre-fiche" class="fenetre-fiche"></div>
      </div>
    </div>
    <h2 id="fenetre-titre"></h2>
    <div id="fenetre-corps" class="fenetre-corps"></div>
  </dialog>

  <!-- L'impact joué au clic sur une case ouverte (flash, lignes de vitesse, onomatopée).
       Décoratif : copié dans la page le temps de l'animation, puis retiré. -->
  <template id="modele-impact">
    <div class="impact" aria-hidden="true">
      <div class="impact-flash"></div>
      <div class="impact-lignes"></div>
      <p class="impact-mot" lang="ja"></p>
    </div>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
